name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l ./cmd)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build without CGO for Linux, Windows, and macOS
        shell: bash
        run: |
          set -euo pipefail
          for target in linux windows darwin; do
            suffix=""
            if [[ "$target" == windows ]]; then suffix=".exe"; fi
            CGO_ENABLED=0 GOOS="$target" GOARCH=amd64 go build -o "/tmp/oddyness-${target}${suffix}" ./cmd/oddyness
          done
