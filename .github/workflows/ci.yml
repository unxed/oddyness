name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify module files are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Install GTK, Xvfb and xdotool
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-0 xvfb xdotool scrot
      - name: Native GTK form, catalog and documents window scenarios (real window, real keystrokes, separate processes)
        env:
          ODDYNESS_NATIVE_UI: "1"
          ODDYNESS_ARTIFACT_DIR: ${{ runner.temp }}/native-shots
        run: go test -count=1 -v -run 'TestNativeForm|TestNativeApp|TestNativeDocuments' ./cmd/oddyness
      - name: goWidgets native table on GTK at the pinned revision (upstream test, real GTK under Xvfb)
        run: |
          xvfb-run -a go test -count=1 -v github.com/unxed/goWidgets/backends/gtk/tabletest | tee "$RUNNER_TEMP/tabletest.log"
          grep -- '--- PASS: TestTableAgainstGTK' "$RUNNER_TEMP/tabletest.log"
      - name: Upload native screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-shots
          path: ${{ runner.temp }}/native-shots
          if-no-files-found: warn
      - name: Scale correctness, retained memory and posting/query benchmarks (output is the measurement)
        run: |
          go test -count=1 -v -run 'TestScaleBalances|TestNoRetainedGrowth' ./internal/perf
          go test -run '^$' -bench . -benchtime=50x -benchmem ./internal/perf
      - name: Benchmark exact numbers (informational output)
        run: go test -run '^$' -bench . -benchmem ./internal/value
      - name: Benchmark BSL VM hot loops (informational output)
        run: go test -run '^$' -bench . -benchmem ./internal/vm
      - name: Probe decimal candidates (separate module, informational output)
        working-directory: internal/value/probe
        env:
          CGO_ENABLED: "0"
        run: |
          go vet ./...
          go test -v -run TestCandidates ./... | grep -E 'RESULT|^(ok|FAIL|---)'
          go test -run '^$' -bench . -benchmem ./...
      - name: List linked modules of the storage package (informational output)
        run: go list -deps -f '{{with .Module}}MODULE {{.Path}} {{.Version}}{{end}}' ./internal/storage/... | sort -u
      - name: Build storage without CGO for Linux, Windows, and macOS
        shell: bash
        run: |
          set -euo pipefail
          for target in linux windows darwin; do
            CGO_ENABLED=0 GOOS="$target" GOARCH=amd64 go build ./internal/storage/...
          done
      - name: Build without CGO for Linux, Windows, and macOS
        shell: bash
        run: |
          set -euo pipefail
          for target in linux windows darwin; do
            suffix=""
            if [[ "$target" == windows ]]; then suffix=".exe"; fi
            CGO_ENABLED=0 GOOS="$target" GOARCH=amd64 go build -o "/tmp/oddyness-${target}${suffix}" ./cmd/oddyness
          done
